name: Security Audit

on:
  # Run every Monday at 9 AM UTC
  schedule:
    - cron: '0 9 * * 1'
  # Allow manual trigger
  workflow_dispatch:
  # Run on security-related file changes
  push:
    paths:
      - 'packages/**/src/**/*.ts'
      - '**/package.json'
      - '**/bun.lockb'
      - '.github/workflows/security.yml'

jobs:
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run bun audit
        run: |
          echo "Running security audit on all packages..."
          bun audit || echo "::warning::Security vulnerabilities found in dependencies"

      - name: Check for known CVEs
        run: |
          cd packages/terminal
          # Check ws version (CVE-2024-37890)
          WS_VERSION=$(bun pm ls ws 2>/dev/null | grep "ws@" | head -1 | sed 's/.*ws@//' | sed 's/ .*//')
          echo "ws version: $WS_VERSION"
          
          if [[ "$WS_VERSION" =~ ^8\.1[0-6]\. ]]; then
            echo "::error::ws version $WS_VERSION is vulnerable to CVE-2024-37890 (DoS)"
            echo "::error::Please update to ws >= 8.17.1"
            exit 1
          fi

      - name: Check for exposed secrets
        run: |
          echo "Checking for accidentally committed secrets..."
          
          # Check for common secret patterns
          if git grep -E "(API_KEY|SECRET|PASSWORD|TOKEN).*=.*['\"][^'\"]{20,}" -- '*.ts' '*.js' '*.json'; then
            echo "::warning::Potential secrets found in code. Review manually."
          fi
          
          # Check for .env files
          if git ls-files | grep -E "\.env$"; then
            echo "::error::.env files should not be committed"
            exit 1
          fi

  codeql-analysis:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-audit, codeql-analysis]
    if: always()

    steps:
      - name: Security Status
        run: |
          echo "## Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency Audit: ${{ needs.dependency-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- CodeQL Analysis: ${{ needs.codeql-analysis.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See SECURITY.md for vulnerability status" >> $GITHUB_STEP_SUMMARY
